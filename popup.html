<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Flow</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>
    <main class="panel">
        <header class="header">
            <div>
                <h1>ChatGPT Flow</h1>
                <p id="status-text">Flow включён</p>
            </div>

            <label class="switch" aria-label="Включить или выключить ChatGPT Flow">
                <input id="flow-enabled" type="checkbox" />
                <span class="slider"></span>
            </label>
        </header>

        <section class="setting">
            <div class="setting-copy">
                <label for="silence-seconds">Отправка после тишины</label>
                <span>От двух до девяноста секунд</span>
            </div>

            <div class="number-wrap">
                <input id="silence-seconds" type="number" min="2" max="90" step="1" inputmode="numeric" />
                <span>сек</span>
            </div>
        </section>
    </main>

    <script src="popup.js"></script>
</body>

</html>
